name: Smoke (deployed)

# Read-only Playwright checks against the URL Vercel just deployed. Runs on
# every successful Vercel deployment (preview or production) via the GitHub
# deployment_status event, and on demand against any URL.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to test (defaults to production)"
        required: false
        default: "https://www.outbackconnections.com.au"

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_BASE_URL: ${{ github.event.inputs.url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      SMOKE_LEGACY_SLUG: ${{ github.event.deployment_status.environment == 'Production' && 'boundary-builders-farm-fencing-2820-LST-QVBYD9EJ' || '' }}
      # Previews are behind Vercel Authentication; this header gets through.
      # Create it under Vercel → Settings → Deployment Protection → Protection
      # Bypass for Automation, then add it as a GitHub Actions secret.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke
        run: |
          echo "Testing $SMOKE_BASE_URL"
          npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
